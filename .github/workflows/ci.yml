name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: CGO check
        run: bash scripts/check-cgo.sh
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Vet
        run: go vet ./...

  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Fetch nixpkgs pin
        run: |
          mkdir -p testdata
          curl -fsSL -o /tmp/nixpkgs.tar.gz https://github.com/NixOS/nixpkgs/archive/50ab793786d9de88ee30ec4e4c24fb4236fc2674.tar.gz
          mkdir -p testdata/nixpkgs
          tar -xzf /tmp/nixpkgs.tar.gz -C testdata/nixpkgs --strip-components=1
      - name: Ladder tests
        continue-on-error: true
        env:
          CGO_ENABLED: '0'
        run: go test ./ladder/... -count=1
